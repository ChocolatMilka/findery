[workspace]
resolver = "3"
members = ["crates/core", "crates/chunk", "crates/embed", "crates/store", "crates/index", "crates/server", "crates/client", "crates/mcp", "crates/cli", "crates/bench"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/local/findery"

[workspace.dependencies]
# --- L0 internes -----------------------------------------------------------
findery-core   = { path = "crates/core" }
findery-chunk  = { path = "crates/chunk" }
findery-embed  = { path = "crates/embed" }
findery-store  = { path = "crates/store" }
findery-index  = { path = "crates/index" }
findery-server = { path = "crates/server" }
findery-client = { path = "crates/client" }

# --- runtime ---------------------------------------------------------------
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-std", "io-util", "process"] }
futures     = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

# --- sérialisation ---------------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# --- erreurs / logs --------------------------------------------------------
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- http ------------------------------------------------------------------
axum       = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# --- stockage --------------------------------------------------------------
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# --- système de fichiers ---------------------------------------------------
ignore  = "0.4"
globset = "0.4"
notify  = "6"

# --- divers ----------------------------------------------------------------
blake3 = "1"
clap   = { version = "4", features = ["derive", "env"] }
uuid   = { version = "1", features = ["v4", "serde"] }
time   = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
