# Reference configuration. Every value below is the default, so an empty file —
# or no file at all — yields exactly this. Three exceptions are marked inline:
# `store.data_dir` is platform-dependent, Docker Compose overrides a handful
# of values through `FINDERY_*` so one image can serve every deployment, and the
# `[models.*]` profiles at the end of `[embedder]` are shipped examples — inert
# until `default_model` names one.
#
# Mount it at /etc/findery/config.toml, or point FINDERY_CONFIG elsewhere.
# `FINDERY_*` environment variables always win over this file, which is what lets one
# image serve every deployment.
#
# Check what the daemon actually resolved:  finderyd --check

# The model profile the daemon embeds with: `embedder` (the [embedder] section
# below, also what leaving this out means) or the alias of a [models.<alias>].
# FINDERY_MODEL overrides it. Switching profile is free in both directions when
# both have indexed: each model's vectors live under their own recipe.
# default_model = "harrier"

[server]
bind = "0.0.0.0:8077"
# Address a client dials to reach this daemon — `findery`, the MCP bridge, the
# Rust client. The daemon itself ignores it, which is what lets a client on this
# machine find the daemon without FINDERY_SERVER_URL in every shell.
# Point it at another host to share one index with a team.
url = "http://127.0.0.1:8077"
# Uncomment to require `Authorization: Bearer <token>` on everything but /healthz.
# A client reads the same value as its bearer token.
# api_token = "change-me"
max_body_bytes = 33554432
# Concurrent sync jobs. More than the embedding runtime can feed just queues.
job_concurrency = 2
job_history = 64
# How long `findery detach` / `findery rm` wait for a running sync of the
# project to stop before giving up with `busy` (and changing nothing).
drain_timeout_secs = 15
# Longest a sync request may wait for its job (`wait_ms`, what the MCP `sync`
# tool sends) before answering with the job as it stands.
max_sync_wait_ms = 120000

[embedder]
# "openai_compat" talks to anything serving /v1/embeddings: TEI, llama.cpp,
# vLLM, Ollama, LM Studio, OpenAI, Voyage, Jina. "mock" is for offline tests.
backend = "openai_compat"
# `qwen3.7-text-embedding` is served by DashScope; it has no Hugging Face
# weights, so nothing local can host it. Point this at a local runtime instead
# (http://127.0.0.1:1234 for LM Studio, :11434 for Ollama) and set `model` to
# whatever that runtime reports — a different model is a different recipe, and
# a recipe change is a re-index.
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode"
path = "/v1/embeddings"
model = "qwen3.7-text-embedding"
# api_key = "sk-..."
auth_header = "Authorization"
auth_prefix = "Bearer "
# Expected vector width. 0 means "ask the runtime at startup".
dim = 1024
# Matryoshka truncation. qwen3.7-text-embedding (256-2560) and text-embedding-3-* honour it;
# others reject the field outright.
send_dimensions = false
# Probe once at boot and refuse to run on a width mismatch. Leave this on: half
# a corpus at the wrong width is unsearchable and silent.
verify_dim = true
batch_size = 32
concurrency = 2
timeout_secs = 120
max_retries = 3
max_input_chars = 24000
# L2-normalize on arrival, so cosine becomes a dot product downstream.
normalize = true
# Applied to QUERIES only — qwen3.7-text-embedding is asymmetric by design. A
# caller can override it per search, either with a named preset (`task`: code,
# symbol, usage, docs, test, config, error) or with free-form text. Qwen
# measures +1 to 5% retrieval accuracy from a tailored instruction — it costs one
# prefix on a string that was going to be embedded.
query_instruction = "Given a developer question about a codebase, retrieve the source code or documentation passages that answer it."
# The prompt format is a fact about the weights. Unset, a query is
# "Instruct: {instruction}\nQuery: {query}" (Qwen3, Harrier) and a document is
# sent as it is. A nomic-style model wants
#   query_template    = "search_query: {query}"
#   document_template = "search_document: {text}"
# A non-default document_template opens its own vector space (it enters the
# recipe as `|doc=<fingerprint>`): every stored vector depends on it.
# query_template = "Instruct: {instruction}\nQuery: {query}"
# document_template = "{text}"
# Canonical name of the weights, when the runtime's name for them is not one.
# It replaces `model` in the recipe — see the profiles below.
# weights = "Qwen/Qwen3-Embedding-0.6B"

# Extra static headers, for gateways and tenancy.
# [embedder.extra_headers]
# "OpenAI-Organization" = "org-123"

# Model profiles: each one says only what differs from [embedder] and inherits
# the rest — except the secrets (api_key, extra_headers, auth_header,
# auth_prefix), which never follow a profile to another base_url, and the facts
# about the weights (weights, query_template, document_template), which never
# follow it to another model. Select one with `default_model` or FINDERY_MODEL.
#
# `weights` is the canonical identity of what a runtime serves. Set it and LM
# Studio's `harrier-oss-v1-0.6b` and TEI's `microsoft/harrier-oss-v1-0.6b` —
# one set of weights under two names — share their vectors. A GGUF
# quantization (Q8_0, Q4_K_M) is NOT the same weights: give it its own name, or
# leave `weights` unset so the runtime's name keeps it apart.

# Microsoft Harrier, as LM Studio serves it: Qwen3-based, 1024 dims, MIT, the
# same Instruct/Query query format, documents raw.
[models.harrier]
base_url = "http://localhost:1234"
model = "harrier-oss-v1-0.6b"
dim = 1024
# weights = "microsoft/harrier-oss-v1-0.6b"

# Qwen3-Embedding-0.6B, as LM Studio serves it. Its recipe is
# `text-embedding-qwen3-embedding-0.6b:1024` — the same as an [embedder] naming
# that model, so the two share every vector. Setting `weights` here renames the
# recipe, and the next sync embeds again under the new name.
[models.qwen3]
base_url = "http://localhost:1234"
model = "text-embedding-qwen3-embedding-0.6b"
dim = 1024
# weights = "Qwen/Qwen3-Embedding-0.6B"

[store]
# "sqlite": vectors beside the bucket, searched from a warm in-memory matrix.
#           Exact, no extra service, ~11 ms at 50k chunks (1024 dims).
# "qdrant": a local vector database — HNSW, payload filters, int8 quantization.
backend = "sqlite"
# Platform-dependent by default: `%LOCALAPPDATA%/findery` on Windows,
# `$XDG_DATA_HOME/findery` or `~/.local/share/findery` elsewhere.
# Compose sets `/data`. One `bucket.db` there holds every project — it is the
# file worth backing up. Uncomment to pin it.
# data_dir = "/data"
# `export_dir` follows `data_dir` unless you pin it here.
# export_dir = "/data/exports"

[store.qdrant]
# Loopback by default, like the embedder: the documented setup runs the daemon
# natively. Compose overrides this with `http://qdrant:6333`.
url = "http://127.0.0.1:6333"
# api_key = "..."
collection_prefix = "findery_"
timeout_secs = 30
# 4x smaller vectors for roughly 1% recall loss.
scalar_quantization = false

[chunk]
# Hard ceiling of one chunk, in characters (~3.6 chars per token on Rust).
max_chars = 2400
# Below this, a fragment is merged with its neighbour: a three-line
# `impl Display` embedded alone is noise.
min_chars = 120
# Overlap when an oversized body has to be split into windows.
overlap_chars = 200
include_tests = true

[search]
default_k = 10
max_k = 100
# "hybrid" fuses vector and BM25 by rank; on code it beats either one alone.
default_mode = "hybrid"
rrf_k = 60.0
candidate_multiplier = 4
# Per-hit text budget. The single most effective token lever for MCP clients.
max_snippet_chars = 2400
# Ceiling of a rendered intent instruction, in bytes. The sentence is always
# kept whole; per-language hints are appended, most important language first,
# while they fit. 0 appends none.
max_instruction_chars = 640
# Pairing (`doc-sync`, `divergence`): each doc hit is matched with its
# `pair_matches` nearest code hits by stored-vector cosine — no new embedding —
# and flagged drifted when even the best is below `drift_below`.
drift_below = 0.5
pair_matches = 2
# `divergence` reports two hits of different files as near-duplicates when
# their cosine falls in this band: above the max they are plain copies.
duplicate_min = 0.85
duplicate_max = 0.98
# A read (`GET /v1/projects/{id}/chunks`, the MCP `read` tool) adds at most
# `max_read_context` lines on each side of its target and returns at most
# `max_read_lines` lines in all.
max_read_context = 200
max_read_lines = 1000

[project_defaults]
# One entry per language the chunker registry knows. `.jsx` and `.tsx` are out
# on purpose: JSX text may hold an apostrophe, which the lexical scanner reads
# as a string opener. `.toml` has no chunker of its own and falls back.
extensions = ["rs", "md", "toml", "js", "mjs", "cjs", "ts", "py", "php", "json", "axle", "java", "kt", "kts", "go"]
# Two families: build output and vendored trees are noise; the rest are
# secret-bearing paths, which matter because hidden entries ARE indexed.
# `.env.example` is caught by `**/.env.*` — drop that line to index it.
exclude = [
    "**/target/**",
    "**/node_modules/**",
    "**/package-lock.json",
    "**/.git/**",
    "**/vendor/**",
    "**/*.lock",
    "**/.env",
    "**/.env.*",
    "**/.ssh/**",
    "**/.aws/**",
    "**/.gnupg/**",
    "**/.netrc",
    "**/.npmrc",
    "**/*.pem",
    "**/*.p12",
    "**/id_rsa*",
    "**/id_ed25519*",
]
follow_gitignore = true
# Index dotfiles and dot-directories. On by default: `.github/workflows`,
# `.cargo/config.toml` and `.claude/docs` are exactly what a developer asks
# about. The exclude list above is what keeps credentials out.
include_hidden = true
max_file_bytes = 2097152

# Host <-> container translation, so search results cite paths a human can open.
# Compose sets this through FINDERY_MOUNTS.
# [[mounts]]
# host = "C:/Users/users/RustroverProjects"
# container = "/workspaces"

# The intent library (`code`, `usage`, `review`, `doc-sync`…) is built in. A
# table here overrides any field of an intent — by name or alias — or defines a
# new one, which then needs a `summary` and an `instruction`. A project manifest
# layers its own `[intents.<name>]` on top of these.
# `{codebase}` renders "a Rust and PHP codebase" from the languages searched.
# [intents.usage.hints]
# php = ["`new X`", "`X::` static calls", "`use` imports", "Symfony service wiring"]
# [intents.migration]
# summary = "Schema migrations."
# instruction = "Given a schema change in {codebase}, retrieve the migrations that apply it."
