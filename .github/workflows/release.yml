# Build, package and publish findery.
#
#   check      the constitution, on every push and pull request
#   windows    the three Windows binaries, once
#   installer  the .msi, and a real install of it
#   release    attached to a GitHub Release, on a `v*` tag
#
# `check` is its own job rather than a step of the Windows build, so a change
# that fails it never reaches packaging.
#
# WiX is pinned to v5: from v6 the toolset requires accepting the Open Source
# Maintenance Fee EULA, and that is the project's licensing decision to make.
#
# `windows-latest` rather than cross-compiling — `rusqlite`'s bundled SQLite is
# C, so a Windows build needs a Windows C toolchain whatever the target triple.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege. Only `release` writes anything, and it asks for it there.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo's incremental cache fights a CI cache that restores `target/`.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The toolset the installer is built with, in one place: the build step and
  # the extension restore below must agree, and a drifting pair fails obscurely.
  WIX_VERSION: "5.0.2"
  # The version the upgrade test installs before the release. Used only when it
  # is genuinely older than the release — see the comparison in `installer`.
  FIXTURE_VERSION: "0.0.1"

jobs:
  # ---------------------------------------------------------------------------
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From `rust-toolchain.toml`, rustfmt and clippy included.
      - run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # fmt-check + clippy + test + layers + sizes: the same command a
      # contributor runs, so "green locally" and "green in CI" are one claim.
      - run: make check

  # ---------------------------------------------------------------------------
  windows:
    name: windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # The three binaries and nothing else; they ship together, see the manifest.
      - run: >
          cargo build --release
          -p findery-cli -p findery-server -p findery-mcp

      # Staged so the manifest names a path, not a cargo layout: the .wxs can
      # then be built by hand without knowing how the binaries were produced.
      - name: Stage the binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($b in @("findery", "finderyd", "findery-mcp")) {
            Copy-Item "target/release/$b.exe" "artifacts/$b.exe"
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  installer:
    name: msi
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: artifacts

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          $tools = "$env:USERPROFILE\.dotnet\tools"
          # `GITHUB_PATH` only reaches *later* steps, and the extension below is
          # added by this one — so the current process needs it too.
          $env:Path = "$tools;$env:Path"
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

          # The Restart Manager integration, to close a running `finderyd` before
          # its file is replaced. Same version as the tool: a mismatched pair
          # fails obscurely at build time.
          wix extension add --global "WixToolset.Util.wixext/$env:WIX_VERSION"
          wix extension list --global

      # A tag names the release, Cargo.toml names the binary. When they disagree
      # the installer is labelled one version and contains another — noticed only
      # after it is published.
      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $raw = $env:GITHUB_REF_NAME
            if ($raw -notmatch '^v(\d+\.\d+\.\d+(\.\d+)?)$') {
              throw "tag `$raw` is not v<major>.<minor>.<patch>; MSI versions are numeric and four parts at most"
            }
            $version = $Matches[1]
            $declared = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                         Select-Object -First 1).Matches[0].Groups[1].Value
            if ($declared -ne $version) {
              throw "tag says $version, Cargo.toml says $declared; bump the workspace version or retag"
            }
          } else {
            # A branch or dispatched build still produces an installer, so the
            # packaging path is exercised before a release depends on it — under a
            # placeholder version nothing should be published as.
            $version = "0.0.0"
          }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

          # The version the upgrade test installs *first*, and only when it is
          # genuinely older than the release.
          #
          # `MajorUpgrade` blocks downgrades — that is what stops someone
          # replacing a newer install with an older one — so on a branch build,
          # whose placeholder is 0.0.0, installing this fixture first would make
          # the "upgrade" a downgrade and the install would refuse with 1603.
          # The table says so in as many words: the 0.0.0 package carries a row
          # `min=0.0.0 max='' attrs=2`, which blocks every version above it.
          function IsOlder($candidate, $release) {
            $a = @($candidate.Split('.') | ForEach-Object { [int]$_ })
            $b = @($release.Split('.') | ForEach-Object { [int]$_ })
            for ($i = 0; $i -lt [Math]::Max($a.Count, $b.Count); $i++) {
              $l = if ($i -lt $a.Count) { $a[$i] } else { 0 }
              $r = if ($i -lt $b.Count) { $b[$i] } else { 0 }
              if ($l -ne $r) { return $l -lt $r }
            }
            return $false
          }
          $fixture = if (IsOlder $env:FIXTURE_VERSION $version) { $env:FIXTURE_VERSION } else { "" }
          if (-not $fixture) {
            Write-Host "no upgrade test: $version has no older version to install first"
          }
          "fixture=$fixture" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          wix build -arch x64 `
                    -ext WixToolset.Util.wixext `
                    -d Version=$v `
                    packaging/windows/findery.wxs `
                    -o "artifacts/findery-$v-x64.msi"

          # A second package, older, from the same sources. Installing it first is
          # the only way to exercise the upgrade path — where the `UpgradeCode`
          # decides whether the new package replaces the old one or sits beside it
          # as a second product. Absent when the release has nothing older.
          $fixture = "${{ steps.version.outputs.fixture }}"
          if ($fixture) {
            wix build -arch x64 `
                      -ext WixToolset.Util.wixext `
                      -d Version=$fixture `
                      packaging/windows/findery.wxs `
                      -o "artifacts/findery-$fixture-x64.msi"
          }

      - name: Install it, run it, upgrade it, remove it
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $msi = "artifacts/findery-$v-x64.msi"
          $exe = "$env:ProgramFiles\findery\findery.exe"

          # msiexec needs a full Windows path. Given `artifacts/x.msi`, it reads
          # the forward slash as a switch separator and answers 1619, "the
          # installation package could not be opened".
          function FullPath($relative) { (Resolve-Path -LiteralPath $relative).Path }

          function Install($package, $tag) {
            $log = Join-Path $PWD "msiexec-$tag.log"
            $p = Start-Process msiexec `
                   -ArgumentList "/i `"$(FullPath $package)`" /qn /norestart /l*v `"$log`"" `
                   -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "install ($tag) failed: $($p.ExitCode)" }
          }

          # What Apps & features would list. One entry, always.
          function FinderyProducts {
            @(
              Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue
              Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue
            ) | Where-Object { $_.DisplayName -eq "findery" }
          }

          $fixture = "${{ steps.version.outputs.fixture }}"
          if ($fixture) {
            Install "artifacts/findery-$fixture-x64.msi" "old"
            Write-Host "products registered before the upgrade: $((FinderyProducts).Count)"
          }

          Install $msi "new"

          # An upgrade must REPLACE the old package, not join it: two registered
          # products leave an entry in Apps & features that removes the other.
          $count = (FinderyProducts).Count
          if ($count -ne 1) { throw "$count 'findery' products are registered; the upgrade did not replace the old one" }

          if (-not (Test-Path $exe)) { throw "findery.exe was not installed to Program Files" }
          foreach ($b in @("findery.exe", "finderyd.exe", "findery-mcp.exe")) {
            $p = "$env:ProgramFiles\findery\$b"
            if (-not (Test-Path $p)) { throw "$b is missing; the three ship together" }
          }

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*\findery*") { throw "the installer did not add itself to PATH" }
          $entries = ([regex]::Matches($machinePath, [regex]::Escape("$env:ProgramFiles\findery"))).Count
          if ($entries -ne 1) { throw "PATH holds the install directory $entries times; an upgrade duplicated it" }

          $out = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "findery --version exited $LASTEXITCODE" }
          Write-Host "ran: $out"

          # A real execution of the second binary, not a presence check.
          & "$env:ProgramFiles\findery\finderyd.exe" --check | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "finderyd --check exited $LASTEXITCODE" }

          $uninstallLog = Join-Path $PWD "msiexec-uninstall.log"
          $p = Start-Process msiexec `
                 -ArgumentList "/x `"$(FullPath $msi)`" /qn /norestart /l*v `"$uninstallLog`"" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $uninstallLog -Tail 40; throw "uninstall failed: $($p.ExitCode)" }

          if (Test-Path "$env:ProgramFiles\findery\findery.exe") { throw "uninstall left the binaries behind" }
          $after = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($after -like "*\findery*") { throw "uninstall left the PATH entry behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          # The release MSI only: 0.0.1 above is a fixture, and publishing it
          # would put a second, older installer on the release page.
          path: artifacts/findery-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything, and the only thing it writes is the
      # release for the tag it was triggered by.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh` rather than a third-party release action: it is on the runner,
          # needs no version kept current, and the token is already here.
          ls -l artifacts
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run after a failure past this point replaces the asset instead
            # of failing on a release that already exists.
            gh release upload "$GITHUB_REF_NAME" artifacts/*.msi --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "findery ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              artifacts/*.msi
          fi
