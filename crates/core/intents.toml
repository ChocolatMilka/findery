[[intent]]
name = "similar"
aliases = ["duplicates", "clones"]
kind = "locate"
summary = "A passage in hand: code that does the same thing elsewhere, near-duplicates that diverged included."
instruction = "Given a code passage from {codebase}, retrieve other passages that implement the same logic or follow the same pattern, including near-duplicates that have since diverged."

# --- Workflow: the searches one task needs ----------------------------------

[[intent]]
name = "review"
aliases = ["impact"]
kind = "workflow"
summary = "Reviewing a change to a target: its callers, the tests that pin it, the docs that describe it, similar code that should change with it."
instruction = "Given a function, type or module of {codebase} under review, retrieve the passages a reviewer must read alongside it: its callers, its tests, its documentation and similar code."

[[intent.legs]]
label = "callers"
intent = "usage"
k = 8

[[intent.legs]]
label = "tests"
intent = "test"
k = 5

[[intent.legs]]
label = "docs"
intent = "docs"
k = 3

[[intent.legs]]
label = "similar"
intent = "similar"
k = 5

[[intent]]
name = "refactor"
aliases = ["rename"]
kind = "workflow"
summary = "Changing a target everywhere: its definition, every usage, its implementations, its tests and its duplicates."
instruction = "Given a symbol of {codebase} about to be refactored, retrieve every passage the change must touch: its definition, its usages, its implementations, its tests and its duplicates."

[[intent.legs]]
label = "definition"
intent = "symbol"
k = 3

[[intent.legs]]
label = "usages"
intent = "usage"
k = 10

[[intent.legs]]
label = "implementations"
intent = "implementations"
k = 5

[[intent.legs]]
label = "tests"
intent = "test"
k = 5

[[intent.legs]]
label = "duplicates"
intent = "similar"
k = 5

# `pairing` matches each hit of the first leg with its nearest hits of the
# second, by stored vector: a weak best match is a doc that drifted.
[[intent]]
name = "doc-sync"
aliases = ["drift"]
kind = "workflow"
pairing = true
summary = "Docs against code: each documentation section beside the code that implements it, to spot what drifted."
instruction = "Given a feature or behaviour of {project}, retrieve the documentation that describes it and the code that implements it, so the two can be compared for drift."

[intent.hints]
markdown = ["README and reference sections stating options, defaults and guarantees"]

[[intent.legs]]
label = "docs"
instruction = "Given a feature or behaviour of {project}, retrieve the documentation sections that describe what it does, its options and the guarantees it makes."
langs = ["markdown"]
kinds = ["doc_section"]

[[intent.legs]]
label = "code"
instruction = "Given a documented feature or behaviour of {codebase}, retrieve the source code that implements it, including its defaults and the checks that enforce its guarantees."
exclude_langs = ["markdown"]

# `duplicates` also reports near-identical code in different files among the
# hits — copies that diverged.
[[intent]]
name = "divergence"
aliases = ["diverged", "inconsistencies"]
kind = "workflow"
pairing = true
duplicates = true
summary = "Where docs and code disagree and where copies drifted apart: doc claims, the code that should honour them, near-duplicates."
instruction = "Given an area of {project}, retrieve the documentation claims about it, the code that should honour them, and near-duplicate code that may have diverged."

[intent.hints]
markdown = ["statements of behaviour, defaults, limits and guarantees"]

[[intent.legs]]
label = "docs"
instruction = "Given an area of {project}, retrieve the documentation passages that make claims about its behaviour, its defaults, its limits or its guarantees."
langs = ["markdown"]
kinds = ["doc_section"]

[[intent.legs]]
label = "code"
instruction = "Given an area of {codebase}, retrieve the source code that implements its behaviour, its defaults, its limits and its guarantees."
exclude_langs = ["markdown"]

[[intent.legs]]
label = "duplicates"
intent = "similar"
exclude_langs = ["markdown"]
k = 10

