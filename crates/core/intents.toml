# Built-in intents: named retrieval tasks an agent picks instead of writing an
# instruction. Embedded in the binary, and parsed by `cargo test`. A daemon
# config or a project manifest overrides any field with `[intents.<name>]`, or
# adds an intent the same way.
#
# instruction  one sentence, "Given <input>, retrieve <what>.". `{codebase}`
#              renders "a Rust and PHP codebase" (or "a codebase"), `{project}`
#              likewise — the languages come from the search.
# hints        constructs per language, appended for the languages searched.
# legs         the searches a workflow runs; `intent = "…"` borrows a locate one.

# --- Locate: one question, one search ---------------------------------------

[[intent]]
name = "code"
kind = "locate"
summary = "The default: where and how something is done — the code or docs that answer a developer question."
instruction = "Given a developer question about {codebase}, retrieve the source code or documentation passages that answer it."

[[intent]]
name = "symbol"
aliases = ["definition", "declaration"]
kind = "locate"
summary = "A name in hand: its definition — declaration, signature or type, and doc comment."
instruction = "Given the name of a symbol in {codebase}, retrieve the passage that defines it: its declaration, its signature or type, and its documentation comment."

[intent.hints]
rust = ["`fn`, `struct`, `enum`, `trait`, `type`, `const` and `macro_rules!` items", "their `///` docs", "`#[derive]` attributes"]
axle = ["`fn`, `class`, `struct`, `trait`, `enum`, `exception` and `const` declarations", "`@derive` and `@target` annotations"]
php = ["`function`, `class`, `interface`, `trait` and `enum` declarations", "PHPDoc blocks", "attributes"]
javascript = ["`function`, `class`, `interface` and `type` declarations", "`export const` bindings", "JSDoc"]
python = ["`def` and `class` statements", "decorators", "docstrings", "module-level assignments"]
java = ["`class`, `interface`, `record` and `enum` declarations", "annotations", "Javadoc"]
kotlin = ["`fun`, `class`, `data class`, `object`, `interface` and `typealias` declarations", "KDoc"]
go = ["`func` and `type` declarations", "methods by receiver", "`const` and `var` blocks", "the doc comment above"]

[[intent]]
name = "usage"
aliases = ["callers", "uses", "references"]
kind = "locate"
summary = "An API in hand: its call sites, instantiations, imports and the code wired to it."
instruction = "Given an API, function or type of {codebase}, retrieve the passages that call, instantiate, import or depend on it, showing how it is used in practice."

[intent.hints]
rust = ["call sites", "`impl Trait for` blocks", "generic bounds", "macro invocations", "`use` paths"]
axle = ["calls passing `own`, `mut` or `copy`", "`class Foo : Base, Trait`", "`impl Type : Trait`", "`when T : Bound` groups", "`use crate::…`"]
php = ["`new X`", "`X::` static calls", "`use` imports", "`implements`", "`extends`", "DI container wiring"]
javascript = ["calls", "`new X`", "`import` and `require`", "re-exports", "`extends`", "JSX `<X />`"]
python = ["calls", "`import` and `from … import`", "subclassing", "decorator usages", "`__init__.py` re-exports"]
java = ["method calls", "`new X`", "`implements`", "`extends`", "`@Override`", "`@Autowired` and `@Bean` wiring"]
kotlin = ["calls", "extension receivers", "`override`", "`by` delegation", "constructor injection"]
go = ["method calls on receivers", "package-qualified calls", "struct embedding", "interfaces satisfied by method set"]

