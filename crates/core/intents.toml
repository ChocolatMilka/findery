name = "implementations"
aliases = ["impls", "implementors", "subclasses", "overrides"]
kind = "locate"
summary = "A trait, interface or base class in hand: every type that implements, extends or overrides it."
instruction = "Given a trait, interface or base class of {codebase}, retrieve the types that implement, extend or override it, together with their implementing methods."

[intent.hints]
rust = ["`impl Trait for Type` blocks", "blanket `impl<T: Bound>` impls", "`#[derive]` of the trait"]
axle = ["`impl Type : Trait` blocks", "`class Foo : Base, Trait`", "`when T : Bound` method groups"]
php = ["classes that `implements` or `extends` it", "`use` of the trait in a class"]
javascript = ["classes that `extends` the base", "TypeScript `implements`", "objects shaped to the type"]
python = ["subclasses", "ABC and `Protocol` implementations", "overridden methods"]
java = ["classes that `implements` or `extends` it", "`@Override` methods"]
kotlin = ["types listing it after `:`", "`override` members", "`by` delegation"]
go = ["types whose methods satisfy the interface implicitly"]

