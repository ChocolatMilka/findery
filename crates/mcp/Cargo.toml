[package]
name                   = "findery-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description            = "L4 - MCP stdio bridge, so Claude Code can query the index."

[[bin]]
name = "findery-mcp"
path = "src/main.rs"

[lib]
name = "findery_mcp"
path = "src/lib.rs"

[dependencies]
findery-core   = { workspace = true }
findery-client = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

# The bridge's end-to-end tests run it against a real daemon on loopback: the
# server is an L3 crate, below this one, so the edge still descends.
[dev-dependencies]
findery-server = { workspace = true }
axum           = { workspace = true }
tempfile       = "3"
toml           = { workspace = true }
