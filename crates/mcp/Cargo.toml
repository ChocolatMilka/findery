[package]
name                   = "findery-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description            = "L4 - MCP stdio bridge, so Claude Code can query the index."

[[bin]]
name = "findery-mcp"
path = "src/main.rs"

[lib]
name = "findery_mcp"
path = "src/lib.rs"

[dependencies]
findery-core   = { workspace = true }
findery-client = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
