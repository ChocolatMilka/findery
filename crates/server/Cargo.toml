[package]
name                   = "findery-server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description            = "L3 - HTTP API and the findery daemon binary."

[[bin]]
name = "finderyd"
path = "src/main.rs"

[lib]
name = "findery_server"
path = "src/lib.rs"

[dependencies]
findery-core  = { workspace = true }
findery-index = { workspace = true }
findery-store = { workspace = true }

axum               = { workspace = true }
clap               = { workspace = true }
parking_lot        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
toml               = { workspace = true }

[dev-dependencies]
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
